# 테스트 전용 appsettings
# 테스트 바이너리 출력 경로 기준: Code/ServerTest/bin/Debug/net8.0/

# CoreConfig 는 루트에서 읽는다
UseUserLock: false

# GameConfig 는 "Game" 섹션에서 읽는다. 루트에 두면 통째로 무시된다.
Game:
    UseSwagger: false
    SessionExpireSpan: 01:00:00
    IsShowErrorDetail: true
    UseStrictValidation: true
    ForceContentType: application/json
    # 테스트 출력 디렉토리 기준 상대경로
    DefaultPlayerPath: ../../../../Server/Data/DefaultPlayer.json

Proto:
    CsvPath: ../../../../../Data/Csv/Proto

Logging:
    LogFolder: logs
    LogLevel:
        Default: Warning
        Microsoft.AspNetCore: Warning

Cache:
    Type: InMemory
    DefaultTtl: 01:00:00

Db:
    Type: InMemory
    UserDb:
        ConnectionStrList: []
    AuthDb:
        ConnectionStrList: []
    CenterDb:
        ConnectionStrList: []
